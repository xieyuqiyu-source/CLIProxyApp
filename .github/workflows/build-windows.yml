name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-windows.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout CLIProxyApp
        uses: actions/checkout@v4

      - name: Checkout CLIProxyApi
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyApi

      - name: Checkout CLIProxyManagement
        uses: actions/checkout@v4
        with:
          repository: xieyuqiyu-source/Cli-Proxy-API-Management-Center
          path: CLIProxyManagement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows bundle
        env:
          CLIPROXYAPI_DIR: ${{ github.workspace }}\CLIProxyApi
          CLIPROXYMANAGEMENT_DIR: ${{ github.workspace }}\CLIProxyManagement
        run: npm run tauri build -- --bundles msi,nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyApp-windows
          path: |
            src-tauri/target/release/bundle/msi/*
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error
