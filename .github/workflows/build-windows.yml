name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/build-windows.yml"
      - "src/**"
      - "src-tauri/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: write

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - name: Checkout CLIProxyApp
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('src-tauri/tauri.conf.json').read_text())
          print(data['version'])
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag_name=v$version" >> "$GITHUB_OUTPUT"
          echo "release_name=v$version" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: prepare-release
    runs-on: windows-latest
    steps:
      - name: Checkout CLIProxyApp
        uses: actions/checkout@v4

      - name: Checkout CLIProxyApi
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyApi

      - name: Checkout CLIProxyManagement
        uses: actions/checkout@v4
        with:
          repository: xieyuqiyu-source/Cli-Proxy-API-Management-Center
          path: CLIProxyManagement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build Windows bundle
        env:
          CLIPROXYAPI_DIR: ${{ github.workspace }}\CLIProxyApi
          CLIPROXYMANAGEMENT_DIR: ${{ github.workspace }}\CLIProxyManagement
        run: npm run tauri build -- --bundles nsis

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyApp-windows
          path: |
            src-tauri/target/release/bundle/nsis/*
          if-no-files-found: error

  build-macos:
    needs: prepare-release
    runs-on: macos-latest
    steps:
      - name: Checkout CLIProxyApp
        uses: actions/checkout@v4

      - name: Checkout CLIProxyApi
        uses: actions/checkout@v4
        with:
          repository: router-for-me/CLIProxyAPI
          path: CLIProxyApi

      - name: Checkout CLIProxyManagement
        uses: actions/checkout@v4
        with:
          repository: xieyuqiyu-source/Cli-Proxy-API-Management-Center
          path: CLIProxyManagement

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm install

      - name: Build macOS bundle
        env:
          CLIPROXYAPI_DIR: ${{ github.workspace }}/CLIProxyApi
          CLIPROXYMANAGEMENT_DIR: ${{ github.workspace }}/CLIProxyManagement
        run: npm run tauri build -- --bundles app,dmg

      - name: Package macOS app bundle
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist-macos
          for app in src-tauri/target/release/bundle/macos/*.app; do
            app_name="$(basename "$app")"
            zip_name="${app_name%.app}.app.zip"
            ditto -c -k --sequesterRsrc --keepParent "$app" "dist-macos/$zip_name"
          done
          cp src-tauri/target/release/bundle/dmg/*.dmg dist-macos/

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyApp-macos
          path: |
            dist-macos/*.app.zip
            dist-macos/*.dmg
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-release
      - build-windows
      - build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: CLIProxyApp-windows
          path: dist-release/windows

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: CLIProxyApp-macos
          path: dist-release/macos

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-release.outputs.tag_name }}
          name: ${{ needs.prepare-release.outputs.release_name }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist-release/windows/*
            dist-release/macos/*
